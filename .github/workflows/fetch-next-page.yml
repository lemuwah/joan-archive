name: Fetch next archive page(s)

# Manual trigger only — this never runs automatically. Chasing the next page is a
# deliberate research action, and every result (found or not) needs a human look
# before it's trusted, per the archive's own Law 7 / no-trust-without-evidence rule.
#
# It never pushes to main and never merges its own PR. It opens a PR with:
#   - any newly fetched page(s) in images/_pending_review/
#   - an AI triage sidecar per image (rough transcription + term-match flag, tagged AI-SOURCED)
#   - the updated research_queue/next_page_fetch_log.md (found AND not-found results both logged)
# A human reviews the PR, promotes anything real into images/ with a descriptive name and
# a proper Search Log entry on the relevant people/ page, and updates that volume's
# last_known_seq in tools/next_page/sources.yml before merging.

on:
  workflow_dispatch:
    inputs:
      volume_id:
        description: "Internet Archive identifier to chase (leave blank to run every volume in sources.yml with a non-null last_known_seq)"
        required: false
        default: ""

jobs:
  fetch-and-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch next page(s)
        run: |
          if [ -n "${{ github.event.inputs.volume_id }}" ]; then
            python tools/next_page/fetch_next_ia_page.py --id "${{ github.event.inputs.volume_id }}"
          else
            python tools/next_page/fetch_next_ia_page.py
          fi

      - name: AI triage of anything newly fetched
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python tools/next_page/triage_pending_images.py
          else
            echo "No ANTHROPIC_API_KEY secret set — skipping AI triage. Fetched images and the fetch log still get a PR; a human will need to look at them cold."
          fi

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Next-page fetch: automated pull for review"
          title: "Next-page fetch results — needs human review before merge"
          body: |
            Automated by `fetch-next-page.yml`. Nothing here is trusted yet.

            - Any image in `images/_pending_review/` needs to be either promoted into
              `images/` with a descriptive name + a Search Log entry on the relevant
              `people/` page, or discarded if it's not actually relevant.
            - `research_queue/next_page_fetch_log.md` has one line per attempt, found or not.
            - `.triage.md` sidecars (if present) are AI-SOURCED rough reads only — verify
              before citing anything from them.
            - Update `tools/next_page/sources.yml`'s `last_known_seq` for any volume this
              PR advanced, before merging — the script does not do this itself.
          branch: next-page-fetch/${{ github.run_id }}
          add-paths: |
            images/_pending_review/**
            research_queue/next_page_fetch_log.md
