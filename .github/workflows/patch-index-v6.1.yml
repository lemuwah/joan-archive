name: 'Patch index v6.1'

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          sed -i 's/\&x26a0;\&xfe0f;/⚠️/g' index.html
          sed -i "s/Absent from English records after 1672. Fate unknown: execution, enslavement, or flight./Per Absolom affidavit (1677\/78): conveyed out of the country. Ninigret and other Niantic\/Narragansett sachems maintained neutrality during King Philip's War./g" index.html
          grep -c 'x26a0' index.html && echo 'WARN: x26a0 still present' || echo 'OK: x26a0 fixed'
          grep -c 'Fate unknown' index.html && echo 'WARN: Fate unknown still present' || echo 'OK: Fate unknown fixed'

      - name: Commit changes
        run: |
          git config user.name 'lemuwah'
          git config user.email 'lemuwah@gmail.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix index.html: emoji encoding + Anashuecot Absolom correction'
          git push
