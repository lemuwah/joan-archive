name: Spine restructure + timeline sync
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix spine section 1 - add Law 6 context
        run: |
          if [ -f theory/source_spine.md ]; then
            # Add Law 6 note after the Tier 1/Tier 2 thesis
            sed -i '/^\*.*Tier 2.*UNVERIFIED/a \
\
> **Law 6 Note (Sep 6, 2026):** The Tier 1\/Tier 2 thesis above was the original research hypothesis. It is now held as one of seven competing models (Model A). All seven models start from the same four verified facts and receive equal analytical treatment. The thesis framing is retained here for historical continuity but does not indicate privileged status. See `theory\/joan_ancestry_shadow_models.md` for all seven models and `methodology\/agent_orientation.md` for the current state of evidence.' theory/source_spine.md
            echo "Spine section 1 Law 6 note added"
          fi

      - name: Add Sep 5-6 timeline entries to spine section 2
        run: |
          if [ -f theory/source_spine.md ]; then
            # Add new timeline entries before the "---" after the last timeline entry
            # Use python for reliable multi-line insertion
            python3 << 'PYEOF'
          with open('theory/source_spine.md', 'r') as f:
              content = f.read()

          new_entries = """
| 1668 | Thomas Fflanders signs Wickford petition for CT jurisdiction. Married Sarah Greene (daughter of John and Joan per Bates). John Greene Sr. does NOT sign. | Thomas Fflanders, Sarah Greene | Wickford | Bartlett Vol. II pp. 226-227 | PLAUSIBLE |
| 1664 | Richard Smith Jr. protests arrest of "John Greene, Sr." from Smith's house at Aquidneset under RI warrant | John Greene Sr., Richard Smith Jr. | Aquidneset | Bartlett Vol. II p. 45 | PLAUSIBLE |
| Dec 31, 1635 | "Received by me Roger Williams of John Green" — pre-Providence. Which John? | John Green (identity disputed) | pre-Providence | Williams correspondence | PLAUSIBLE |
| 1676 | John Greene transports Potuck in his sloop from Providence to Newport for negotiation | John Greene Sr., Potuck, Roger Williams, Arthur Fenner | Providence/Newport | Published KPW sources | PLAUSIBLE |
| 1687 | "Anochetuekett River" used as boundary marker in Bartlett Vol. III — place name, NOT a living person | Geography (sachem territory name) | Cocumscussoc/Quidnessett | Bartlett Vol. III pp. 224-227 | PROOF |
"""

          # Find the last timeline row and add after it
          if '| 1941 |' in content or '| n.d. |' in content:
              # Insert before the --- after the timeline
              marker = '\n---\n\n## 3.'
              if marker in content:
                  content = content.replace(marker, new_entries + '\n---\n\n## 3.')
                  print('Timeline entries added before section 3')
              else:
                  print('Could not find section 3 marker')
          else:
              print('Could not find timeline end marker')

          with open('theory/source_spine.md', 'w') as f:
              f.write(content)
          PYEOF
            echo "Timeline entries added"
          fi

      - name: Add contamination events 4 and 5 to spine section 7
        run: |
          if [ -f theory/source_spine.md ]; then
            python3 << 'PYEOF'
          with open('theory/source_spine.md', 'r') as f:
              content = f.read()

          new_contam = """
*   **Clarke 1903 "daughter of sachem" — AI hallucination (Sep 5, 2026):** A web search summary reported Clarke's *Greenes of Rhode Island* (1903) contained a family tradition that Joan was "the daughter of an Indian sachem," attributed to Frederick Rathbun Townroe. Full text download and search of the 2.7MB book found ZERO hits for Joan of Quidnessett, Townroe, sachem, or any related term. Clarke covers the Warwick Greenes exclusively. The search engine fabricated a summary from nonexistent content. Caught by Law 7 (researcher requested source verification before committing) + Law 4.

*   **1663 CT petition conflation (Sep 5, 2026):** The archive previously claimed John Greene signed a "1663 CT jurisdiction petition." This cannot be verified in Bartlett. It is likely a conflation with the 1668 Wickford petition (Bartlett II pp. 226-227), on which John is NOT among the printed signers. John WAS pardoned for CT adherence (Bartlett II p. 51). Downgraded to PLAUSIBLE.
"""

          # Find the contamination log section and add before the next section
          if 'Bow-and-Arrow Mark' in content:
              marker = '\n---\n\n## 8.'
              if marker in content:
                  content = content.replace(marker, '\n' + new_contam + '\n---\n\n## 8.')
                  print('Contamination events 4-5 added')
              else:
                  # Try alternate section numbering
                  for i in range(8, 15):
                      alt = f'\n---\n\n## {i}.'
                      if alt in content:
                          content = content.replace(alt, '\n' + new_contam + alt)
                          print(f'Contamination events 4-5 added before section {i}')
                          break

          with open('theory/source_spine.md', 'w') as f:
              f.write(content)
          PYEOF
            echo "Contamination events added"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git diff --cached --stat
            git commit -m "fix: spine restructure — Law 6 thesis note, Sep 5-6 timeline, contamination #4-5"
            git push
          fi
