name: Historical Source Audit

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Source manifest"
        required: true
        default: "research/sources/north-kingstown-008204949-10.yml"

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Fetch source
        run: python tools/fetch_source.py --source "${{ inputs.source_file }}"

      - name: Resolve source ID
        id: source
        run: |
          SOURCE_ID=$(python - "${{ inputs.source_file }}" <<'PYTHON'
          import sys
          import yaml
          from pathlib import Path

          manifest = yaml.safe_load(
              Path(sys.argv[1]).read_text(encoding="utf-8")
          )
          print(manifest["source_id"])
          PYTHON
          )
          echo "id=$SOURCE_ID" >> "$GITHUB_OUTPUT"

      - name: Hash source
        run: python tools/hash_source.py --source "${{ steps.source.outputs.id }}"

      - name: Preserve working transcription
        run: python tools/transcribe.py --source "${{ inputs.source_file }}"

      - name: Atomize evidence layers
        run: python tools/atomize.py --source "${{ steps.source.outputs.id }}"

      - name: Evidence gate
        run: python tools/evidence_gate.py --source "${{ steps.source.outputs.id }}"

      - name: Build audit report
        run: python tools/build_report.py --source "${{ steps.source.outputs.id }}"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-source-audit
          path: |
            corpus/
            reports/
            review/
