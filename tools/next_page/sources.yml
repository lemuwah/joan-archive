# Registry of Internet Archive volumes this archive draws from.
# Seeded 2026-09-07 from every archive.org/details/<id> link already cited
# somewhere in the repo (grep -rhoE "archive\.org/details/[a-zA-Z0-9_]+").
#
# last_known_seq: the highest IA leaf/page index this archive has already
#   pulled an image from, or already cited a page number for. Left as
#   `null` where no specific page has been logged yet — fill in from the
#   /page/nNN/ links in the citing .md files, or from README.md source notes,
#   before running fetch_next_ia_page.py against that identifier. The script
#   will refuse to run on a `null` entry rather than guess a starting point.
#
# label: human-readable name, for the PR title and pending-review filename.
#
# Add new volumes here as they come up in research — this file is the only
# thing fetch_next_ia_page.py reads to know what to chase next.

