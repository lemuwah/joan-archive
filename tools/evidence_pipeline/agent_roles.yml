# Agent contracts for the evidence pipeline.
# Model/provider selection belongs in the runner or workflow secret configuration.

agents:
  explorer:
    role: discovery
    reads:
      - AGENT_GUARDRAILS.md
      - theory/source_spine.md
      - research_queue/RESEARCH_QUEUE.md
    writes:
      - candidate source records
      - scoped negative search results
    forbidden:
      - promote claims to verified
      - cite search snippets as documents
      - collapse similarly named people

  archivist:
    role: provenance
    reads:
      - candidate source records
      - source images or stable repository records
      - methodology/editorial_standards.md
    writes:
      - repository identifiers
      - page or leaf anchors
      - checksums and access notes
      - claim-to-source maps
    forbidden:
      - infer missing text
      - replace an unavailable primary source with an uncited summary

  transcription:
    role: document-reading
    reads:
      - source image or scan
    writes:
      - rough transcription tagged AI-SOURCED
      - uncertainty markers
      - terms requiring human paleographic review
    forbidden:
      - output unmarked certainty
      - turn OCR into a quotation without image verification

  identity_disambiguator:
    role: person-identity-resolution
    reads:
      - candidate source records
      - people/two-john-firewall.md
      - data/people.yml
      - relevant people pages
    writes:
      - competing identity assignments
      - name, place, date, kinship, and witness comparisons
      - explicit collision warnings
    forbidden:
      - merge people because names match
      - use geography as proof of identity
      - erase an unresolved identity collision

  historical_status:
    role: status-and-power-context
    reads:
      - source image or scan
      - colonial legal and terminology references
      - Indigenous-authored context where available
    writes:
      - source wording for servant, captive, enslaved, free, Indian, Negro, or related terms
      - context notes separating legal category from lived identity
      - searches for records that could confirm or complicate status
    forbidden:
      - infer status from race, surname, occupation, or absence of a record
      - treat a colonial label as a complete identity
      - generalize from another colony or century without marking the comparison

  paleography_variants:
    role: handwriting-and-name-variant-analysis
    reads:
      - original image at readable resolution
      - verified transcriptions
      - methodology/name_variant_registry.md
    writes:
      - literal letterforms and uncertain readings
      - phonetic, orthographic, and scribal variants
      - mark, signature, alias, witness, and formula comparisons
    forbidden:
      - silently normalize historical spelling
      - turn a plausible reading into a quotation
      - identify a person from handwriting style alone

  synthesizer:
    role: bounded-synthesis
    reads:
      - verified source records
      - evidence/joan_verified_facts.md
      - evidence/suspended_items.md
    writes:
      - proposed timeline events
      - explicit proof/plausible/discredited labels
    forbidden:
      - smooth contradictions
      - treat a hypothesis as a fact
      - introduce an uncited date, relationship, or identity

  hostile_reviewer:
    role: falsification
    reads:
      - proposed timeline event
      - every cited source and transcription
      - people/two-john-firewall.md
    writes:
      - alternative explanations
      - identity/date/source failure findings
      - disposition recommendation
    forbidden:
      - approve its own synthesis
      - delete a failed claim or negative result

  human_editor:
    role: publication-gate
    reads:
      - complete run bundle
      - original source images
      - agent outputs and hostile review
    writes:
      - final disposition
      - published evidence or timeline update
    forbidden:
      - publish from OCR alone
      - mark a task done without a same-session verification check
